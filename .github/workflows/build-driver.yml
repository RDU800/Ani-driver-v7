name: Build ani-panvk (Bifrost v7)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates gnupg lsb-release software-properties-common wget \
            pkg-config ninja-build python3-pip python3-mako python3-yaml python3-ply \
            glslang-tools zip unzip curl git bison flex \
            spirv-tools spirv-headers \
            libexpat1-dev zlib1g-dev libelf-dev libdrm-dev

          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all
          apt-cache policy libllvmspirvlib-21-dev
          sudo apt-get install -y \
            llvm-21-dev clang-21 libclang-21-dev libclang-cpp21-dev \
            libclc-21-dev 

          sudo apt-get remove -y meson || true
          python3 -m pip install --break-system-packages --upgrade "meson>=1.7.0" packaging mako
          meson --version
          pkg-config --version
          llvm-config-21 --version

          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version

      - name: Build and install SPIRV-LLVM-Translator (LLVM 21)
        run: |
          LLVM_VER=21
          LLVM_DIR_CMAKE="$(llvm-config-${LLVM_VER} --cmakedir)"
          git clone --depth=1 -b llvm_release_210 https://github.com/KhronosGroup/SPIRV-LLVM-Translator.git /tmp/SPIRV-LLVM-Translator
          cmake -S /tmp/SPIRV-LLVM-Translator -B /tmp/SPIRV-LLVM-Translator/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DLLVM_DIR="${LLVM_DIR_CMAKE}"
          ninja -C /tmp/SPIRV-LLVM-Translator/build -j"$(nproc)"
          sudo ninja -C /tmp/SPIRV-LLVM-Translator/build install
          rm -rf /tmp/SPIRV-LLVM-Translator
          
      - name: Install bindgen-cli
        run: |
          export LIBCLANG_PATH="$(llvm-config-21 --libdir)"
          cargo install --locked bindgen-cli
          bindgen --version

      - name: Install Android NDK r29
        run: |
          if [ -f sources.lock ]; then
            source sources.lock
          fi
          curl -fsSL "https://dl.google.com/android/repository/android-ndk-r29-linux.zip" -o /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /opt/ndk
          NDK_DIR="/opt/ndk/android-ndk-r29"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Fetch mali-panvk source
        uses: actions/checkout@v4
        with:
          repository: JimVulkan/mali-panvk
          ref: main
          path: build/src

      - name: Apply patches
        run: |
          echo "mali-panvk $(cat build/src/VERSION) @ $(git -C build/src rev-parse --short HEAD)"
          printf "# Applied Patches\n\nBase: JimVulkan/mali-panvk @ %s\n\n" \
            "$(git -C build/src rev-parse --short HEAD)" > PATCHES.md
          for p in patches-jv/*.patch; do
            [ -f "$p" ] || continue
            echo ">>> $p"
            git -C build/src apply --3way "$GITHUB_WORKSPACE/$p"
            echo "- $(basename "$p")" >> PATCHES.md
          done

      - name: Bundle files to review
        run: |
          cd build/src
          mkdir -p ../review
          grep -rlE "maxUniformBufferRange|PushDescriptor|push_desc|MapMemory|kbase_map" \
            --include=*.c --include=*.h \
            --exclude-dir=subprojects --exclude-dir=build --exclude-dir=dist . \
            | head -40 | while read -r f; do
                mkdir -p "../review/$(dirname "$f")"
                cp "$f" "../review/$f"
              done
          ls -R ../review | head -60

      - name: Upload review bundle
        uses: actions/upload-artifact@v4
        with:
          name: review-files
          path: build/review
      
      - name: Trial fix - uniform buffer range 64 KiB
        run: |
          cd build/src
          grep -rn "maxUniformBufferRange" --include=*.c --include=*.h \
            --exclude-dir=subprojects --exclude-dir=build . | head
          f=$(grep -rlE "\.maxUniformBufferRange[[:space:]]*=" \
            --include=*.c --include=*.h --exclude-dir=subprojects \
            --exclude-dir=build . | head -n1)
          [ -n "$f" ] || { echo "No match: send me the grep output above"; exit 1; }
          sed -i -E 's/(\.maxUniformBufferRange[[:space:]]*=)[^,]+,/\1 65536,/' "$f"
          git diff
      
      - name: Build and package (mali-panvk build.sh)
        run: |
          cd build/src
          ./build.sh "$ANDROID_NDK_HOME"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp dist/*.zip "$GITHUB_WORKSPACE/dist/"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ani-panvk-bifrost
          path: dist/*

      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v-${{ github.run_number }}-${{ github.sha }}
          name: Ani-Driver Build #${{ github.run_number }} (${{ github.sha }})
          files: |
            dist/*.zip
            PATCHES.md
            
