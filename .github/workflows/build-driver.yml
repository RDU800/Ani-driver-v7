name: Build ani-panvk (Bifrost v7)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config ninja-build python3-pip python3-mako python3-yaml python3-ply \
            glslang-tools zip unzip curl git bison flex \
            llvm-dev libclang-dev libclang-cpp-dev libclc-dev libllvmspirvlib-dev \
            libexpat1-dev zlib1g-dev libelf-dev
          sudo apt-get remove -y meson || true
          python3 -m pip install --break-system-packages --upgrade "meson>=1.7.0" packaging mako
          meson --version
          pkg-config --version
          ls /usr/bin/llvm-config* || true

      - name: Install Android NDK r28c
        run: |
          if [ -f sources.lock ]; then
            source sources.lock
          fi
          curl -fsSL "https://dl.google.com/android/repository/android-ndk-r28c-linux.zip" -o /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /opt/ndk
          NDK_DIR="/opt/ndk/android-ndk-r28c"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Fetch pinned Mesa source
        run: bash scripts/fetch_mesa.sh build/mesa

      - name: Apply patch layers
        run: bash scripts/apply_patches.sh build/mesa

      - name: Cross-compile PanVK for Android aarch64
        run: bash scripts/build_android.sh build/mesa build/out

      - name: Package driver zip
        run: bash scripts/package_adreno_tools.sh build/out dist

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ani-panvk-bifrost
          path: dist/*
          
